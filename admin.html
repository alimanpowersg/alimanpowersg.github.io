<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alimanpowersg Admin</title><link rel="stylesheet" href="style.css"><style>
.admin{min-height:100vh;background:#f4f7fa}.adminbar{background:#071827;color:#fff;padding:18px 0}.adminbar .wrap{display:flex;justify-content:space-between;align-items:center}.panel{padding:45px 0}.box{background:#fff;border:1px solid #dfe8f0;border-radius:16px;padding:28px;margin-bottom:20px}.box h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row{border:1px solid #dfe8f0;border-radius:10px;padding:15px;margin:10px 0;display:flex;justify-content:space-between;gap:15px;align-items:center}.row small{display:block;color:#6b7c8d}.danger{border:0;background:#fee2e2;color:#991b1b;padding:8px 12px;border-radius:7px;cursor:pointer}.logout{color:#9ddaff}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head>
<body class="admin"><div class="adminbar"><div class="wrap"><strong>Alimanpowersg Admin Panel</strong><a class="logout" href="index.html">View Website →</a></div></div>
<main class="wrap panel"><div id="login" class="box"><h2>Admin Login</h2><p>Sign in to manage Alimanpowersg vacancies.</p><input id="user" autocomplete="username" placeholder="Username"><input id="pass" type="password" autocomplete="current-password" placeholder="Password"><button class="btn main" onclick="login()">Login</button><p id="err" style="color:#b91c1c"></p></div>
<div id="dashboard" style="display:none"><div class="box" style="display:flex;justify-content:space-between;align-items:center;gap:15px"><div><h2 style="margin:0">Dashboard</h2><small>Manage your job vacancies below.</small></div><button class="btn" onclick="logout()">Logout</button></div><div class="box"><h2>Add Job Vacancy</h2><div class="grid"><input id="title" placeholder="Job title"><input id="type" placeholder="Type (Full Time / Skilled)"><input id="location" value="Singapore" placeholder="Location"><input id="desc" placeholder="Short description"></div><button class="btn main" onclick="addJob()">Add Vacancy</button></div>
<div class="box"><h2>Project Gallery</h2><p>Upload a project photo and it will appear in the website gallery.</p><div class="grid"><input id="ptitle" placeholder="Project title"><input id="pdesc" placeholder="Short description"><input id="pimage" type="file" accept="image/*"></div><button class="btn main" onclick="addProject()">Upload Project Photo</button><div id="projects"></div></div><div class="box"><h2>Manage Vacancies</h2><div id="rows"></div><button class="btn" onclick="resetJobs()">Reset Demo Jobs</button></div></div></main>
<script>
const defaults=[{title:"Construction Worker",type:"Full Time",location:"Singapore",desc:"General construction manpower opportunities."},{title:"General Worker",type:"Full Time",location:"Singapore",desc:"Operations and site support roles."},{title:"Cleaner",type:"Full Time",location:"Singapore",desc:"Cleaning and facilities support opportunities."}];
function jobs(){return JSON.parse(localStorage.getItem("alimanpowersg_jobs")||"null")||defaults}
function login(){const u=document.getElementById("user").value.trim();const p=document.getElementById("pass").value;if(u==="ali9090"&&p==="sikder8080"){localStorage.setItem("alimanpowersg_auth","1");show()}else document.getElementById("err").textContent="Incorrect username or password."}
function show(){if(localStorage.getItem("alimanpowersg_auth")==="1"){document.getElementById("login").style.display="none";document.getElementById("dashboard").style.display="block";render()}}
function render(){let j=jobs();document.getElementById("rows").innerHTML=j.map((x,i)=>`<div class="row"><div><b>${safe(x.title)}</b><small>${safe(x.type)} • ${safe(x.location)}<br>${safe(x.desc)}</small></div><button class="danger" onclick="del(${i})">Delete</button></div>`).join("")}
function addJob(){let j=jobs();let title=document.getElementById("title").value.trim();if(!title)return alert("Enter a job title.");j.push({title,type:document.getElementById("type").value||"Full Time",location:document.getElementById("location").value||"Singapore",desc:document.getElementById("desc").value||""});localStorage.setItem("alimanpowersg_jobs",JSON.stringify(j));["title","type","desc"].forEach(id=>document.getElementById(id).value="");render()}
function del(i){let j=jobs();j.splice(i,1);localStorage.setItem("alimanpowersg_jobs",JSON.stringify(j));render()}
function resetJobs(){localStorage.removeItem("alimanpowersg_jobs");render()}
function logout(){localStorage.removeItem("alimanpowersg_auth");location.reload()}
function safe(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}show();

function getProjects(){try{return JSON.parse(localStorage.getItem("alimanpowersg_projects"))||[]}catch(e){return[]}}
function renderProjects(){let ps=getProjects(),box=document.getElementById("projects");if(!box)return;box.innerHTML=ps.map((p,i)=>`<div class="row"><div style="display:flex;gap:12px;align-items:center"><img src="${p.image}" style="width:90px;height:60px;object-fit:cover;border-radius:7px"><div><b>${safe(p.title)}</b><small>${safe(p.desc||"")}</small></div></div><button class="danger" onclick="delProject(${i})">Delete</button></div>`).join("")||"<small>No project photos added yet.</small>"}
function addProject(){const f=document.getElementById("pimage").files[0],title=document.getElementById("ptitle").value.trim();if(!f||!title)return alert("Enter a title and choose an image.");if(f.size>1500000)return alert("Please use an image under 1.5 MB.");const r=new FileReader();r.onload=()=>{let ps=getProjects();ps.push({title,desc:document.getElementById("pdesc").value,image:r.result});localStorage.setItem("alimanpowersg_projects",JSON.stringify(ps));document.getElementById("ptitle").value="";document.getElementById("pdesc").value="";document.getElementById("pimage").value="";renderProjects()};r.readAsDataURL(f)}
function delProject(i){let ps=getProjects();ps.splice(i,1);localStorage.setItem("alimanpowersg_projects",JSON.stringify(ps));renderProjects()}

setTimeout(renderProjects,100);
</script></body></html>
